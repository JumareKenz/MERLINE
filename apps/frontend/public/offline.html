<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012C76">
<title>Offline · Merline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #012C76; color: #fff; }
  main { max-width: 360px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 20px 0 8px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: rgba(255,255,255,0.82); }
  button { appearance: none; border: 0; border-radius: 12px; min-height: 48px; padding: 0 24px;
    font: inherit; font-weight: 600; background: #C9EC73; color: #03122E; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/brand/mark-dark-128.png" alt="Merline" width="56" height="56">
  <h1>You're offline</h1>
  <p>This page hasn't been saved to this device yet. Recordings already on the device are safe and will upload when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
