name: Frontend CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/frontend/**'
      - 'docker/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'apps/frontend/**'
      - 'docker/frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: http://localhost:8080
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_WS_URL: ws://localhost:8080

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  # Playwright E2E is intentionally absent until Phase 2.
  #
  # The job previously ran `npx playwright test` with no playwright.config and
  # no tests, so it could only fail. A permanently red pipeline teaches people
  # to ignore CI.
  #
  # It returns in Phase 2 with the MVP acceptance trace as its first test:
  # record a 60-minute interview offline -> upload and transcribe on
  # reconnection -> correct transcript and speakers -> approve findings that
  # play their supporting audio -> report contains only approved findings.


  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/.next/
          retention-days: 7
