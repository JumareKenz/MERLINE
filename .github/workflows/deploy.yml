name: Deploy

# DEPLOYMENT TARGET: Vercel.
#
# This workflow previously deployed to AWS EKS with Helm. It could never have
# worked: it referenced `./charts/merline-api` and `./charts/merline-frontend`,
# and no `charts/` directory exists in this repository. Its smoke tests also
# probed `/api/health`, which did not exist either.
#
# Phase 1 required choosing one deployment target. That is Vercel: both
# projects are already linked, the backend now has a serverless entry point
# (`apps/backend-nestjs/api/index.ts`), and object storage is external so no
# durable filesystem is needed.
#
# See DEPLOYMENT.md for required secrets and the manual migration step.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: apps/backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      # Migrations are NOT run during the build. A Vercel build may run
      # without network access to the database, runs on every deployment
      # including rollbacks, and can execute concurrently — none of which is
      # safe for schema changes. Applied here, once, after a successful build.
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Smoke test
        run: |
          curl -fsS --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/v1/health"
          curl -fsS --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/v1/ready"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    environment: ${{ github.event.inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - name: Smoke test
        run: curl -fsS --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/login" -o /dev/null
