name: Backend CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/backend-nestjs/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'apps/backend-nestjs/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-nestjs
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: merline_test
          POSTGRES_USER: merline
          POSTGRES_PASSWORD: merline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: merline-test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate

      # Phase 1: migrations are the source of truth. Applying them here also
      # proves `prisma migrate deploy` works on a clean database, which is what
      # the deploy pipeline runs.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://merline:merline@localhost:5432/merline_test

      # Fails if schema.prisma has changes that no migration expresses.
      - name: Check for migration drift
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
        env:
          DATABASE_URL: postgresql://merline:merline@localhost:5432/merline_test
          SHADOW_DATABASE_URL: postgresql://merline:merline@localhost:5432/merline_shadow

      - run: npm test
        env:
          DATABASE_URL: postgresql://merline:merline@localhost:5432/merline_test
          JWT_SECRET: test-secret
          # Presence of this flag opts the integration suites in. Without it
          # they skip, so the suite stays runnable on a machine with no DB.
          RUN_DB_TESTS: '1'
          # Object storage acceptance (upload + signed download) runs against
          # MinIO. SSE stays off here: MinIO rejects AES256 without KMS.
          AWS_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_BUCKET: merline-test
          AWS_REGION: eu-west-1

  audit:
    name: npm Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=moderate
